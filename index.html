<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka&display=swap" rel="stylesheet">

    <style>
        /* 1. DEFINICIÓN DE VARIABLES DE COLOR */
        :root {
            --color-acento: #1ec8c5;
            /* Turquesa vibrante */
            --color-fondo: #0f172a;
            /* Un azul pizarra muy oscuro (slate-900) */
            --color-tarjeta: #1e293b;
            /* Un tono más claro para las tarjetas (slate-800) */
            --color-texto: #f8fafc;
            /* Blanco azulado muy limpio */
            --color-texto-tarjeta: #94a3b8;
            /* Gris suave para descripciones */
            --color-borde-tarjeta: #334155;
            /* Bordes sutiles */
        }

        /* 2. APLICACIÓN DE VARIABLES A LOS ESTILOS GLOBALMENTE */
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--color-fondo);
            /* Usando variable */
            color: var(--color-texto);
            /* Usando variable */
        }

        /* Para usar una fuente monoespaciada en títulos específicos */
        .font-code {
            font-family: 'Space Mono', ui-monospace, SFMono-Regular, monospace;
        }

        .font-prisma {
            font-family: 'Fredoka', sans-serif;
        }

        /* Sobrescribir las clases de Tailwind con las variables (para el color de acento) */
        .text-acento {
            color: var(--color-acento);
        }

        .hover-acento:hover {
            color: var(--color-acento);
        }

        .bg-tarjeta {
            background-color: var(--color-tarjeta);
        }

        .border-tarjeta {
            border-color: var(--color-borde-tarjeta);
        }

        .border-tarjeta:hover {
            border-color: var(--color-acento);
        }

        .text-tarjeta {
            color: var(--color-texto-tarjeta);
        }

        .card-guia {
            border-left: 4px solid var(--color-acento);
            background-color: rgba(30, 200, 197, 0.1);
        }

        .puntos-badge {
            background: var(--color-acento);
            color: var(--color-fondo);
            font-family: 'Fredoka', sans-serif;
        }

        /* Marco para 3 puntos */
        .score-3 {
            outline: 3px solid white !important;
            outline-offset: 2px;
            z-index: 50;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* Marco para 2 puntos (cuadrado 3x3) */
        .score-zone-2 {
            border: 2px solid rgba(255, 255, 255, 0.9) !important;
            z-index: 40;
        }

        /* Marco para 1 punto (cuadrado 5x5) */
        .score-zone-1 {
            border: 1.5px dashed rgba(255, 255, 255, 0.6) !important;
            z-index: 30;
        }

        /* Estilo para las etiquetas integradas */
        .cell-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #94a3b8;
            pointer-events: none;
            /* Para que no se puedan clickar */
        }

        /* Asegura que el contenedor principal no colapse */
        #game-layout {
            display: flex;
            align-items: flex-start;
            /* Alinea al inicio para que el marcador no estire el layout */
            width: 100%;
        }

        #control-bar-wrapper {
            flex-shrink: 0;
            width: 12rem;
            /* Antes era w-64 (16rem), ahora 12rem para ganar espacio */
            position: sticky;
            top: 5rem;
            z-index: 20;
        }

        /* El tablero se expandirá automáticamente */
        #game-board {
            flex-grow: 1;
            min-width: 0;
            /* Permite que el flexbox reduzca el tablero si es necesario sin romperlo */
            /* Mantenemos el aspect-ratio para que las celdas sigan siendo cuadradas */
            aspect-ratio: 31 / 17;
        }

        #game-stats {
            display: flex;
            flex-direction: column;
            gap: 4px;
            /* Espacio mínimo controlado entre las tarjetas */
            max-height: 85vh;
            overflow-y: auto;
        }

        /* Scrollbar estética para el marcador */
        #game-stats::-webkit-scrollbar {
            width: 4px;
        }

        #game-stats::-webkit-scrollbar-thumb {
            background: var(--color-acento);
            border-radius: 10px;
        }
    </style>
</head>

    <script type="module">
        document.getElementById('currentYearFooter').textContent = new Date().getFullYear();

        let listaJugadores = [];
        let indiceGuiaActual = 0;
        let jugadorActualVotando = -1;
        let votosRealizados = 0;
        let rondaActual = 1;
        const MAX_RONDAS = 3;
        let colorObjetivo = null;
        const letras = "ABCDEFGHIJKLMNOP".split(""); // 16 letras para 16 filas

        // Configuración del tablero (Estilo Hues and Clues: 30x16 = 480 colores)
        const columns = 30;
        const rows = 16;

        const board = document.getElementById('game-board');



        function generateBoard() {
            const board = document.getElementById('game-board');
            board.innerHTML = '';
            board.style.gridTemplateColumns = `repeat(31, 1fr)`;

            // Fila 0: Números
            const corner = document.createElement('div');
            board.appendChild(corner);
            for (let c = 1; c <= 30; c++) {
                const numCell = document.createElement('div');
                numCell.className = 'cell-label';
                numCell.textContent = c;
                board.appendChild(numCell);
            }

            // Centro del tablero para cálculos
            const centerX = 14.5;
            const centerY = 7.5;

            for (let r = 0; r < rows; r++) {
                const letterCell = document.createElement('div');
                letterCell.className = 'letter-cell cell-label'; // Asegúrate de tener esta clase en CSS
                letterCell.textContent = letras[r];
                board.appendChild(letterCell);

                for (let c = 0; c < columns; c++) {
                    const cell = document.createElement('div');

                    const dx = c - centerX;
                    const dy = r - centerY;

                    // 1. Tono (Hue): Distribución radial
                    let h = (Math.atan2(dy, dx) * (180 / Math.PI)) + 90;
                    if (h < 0) h += 360;

                    // 2. Distancia al centro (normalizada de 0 a 1)
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);
                    const pctDist = dist / maxDist;

                    // 3. Luminosidad (Lightness): Invertida
                    // Centro (distancia 0) -> l = 85% (claro)
                    // Bordes (distancia 1) -> l = 15% (oscuro)
                    const l = 85 - (pctDist * 70);

                    // 4. Saturación: Más vibrante donde hay color (centro-medio)
                    const s = 90 - (pctDist * 30);

                    const color = `hsl(${h}, ${s}%, ${l}%)`;

                    cell.style.backgroundColor = color;
                    cell.className = 'aspect-square w-full cursor-pointer hover:scale-110 hover:z-10 transition-transform duration-100 rounded-sm shadow-sm';
                    cell.addEventListener('click', () => manejarClicCelda(r, c, cell));
                    board.appendChild(cell);
                }
            }
        }
        function highlightSelection(element) {
            // Quitar borde a otros
            document.querySelectorAll('#game-board div').forEach(el => el.style.outline = 'none');
            // Poner borde al seleccionado
            element.style.outline = '3px solid white';
            element.style.outlineOffset = '-3px';
        }


        // --- Lógica del Juego ---

        /**
         * Calcula los puntos basándose en la distancia (Manhattan o Euclidiana)
         * @param {number} fCapa - Fila donde hizo clic el jugador
         * @param {number} cCapa - Columna donde hizo clic el jugador
         */
        function calcularPuntuacion(fClic, cClic) {
            if (!colorObjetivo) return;

            // Calculamos la distancia de celdas
            const distanciaFila = Math.abs(fClic - colorObjetivo.fila);
            const distanciaCol = Math.abs(cClic - colorObjetivo.columna);

            // Determinamos los puntos (Reglas oficiales de Hues and Clues):
            // Dentro del cuadrado 3x3 que rodea al color: 3-2 puntos.
            // En el centro exacto: 3 puntos.
            // En los bordes del cuadrado 3x3: 2 puntos.
            // En el borde exterior del cuadrado 5x5: 1 punto.

            let puntos = 0;
            const maxDist = Math.max(distanciaFila, distanciaCol);

            if (maxDist === 0) puntos = 3;      // ¡Centro exacto!
            else if (maxDist === 1) puntos = 2; // Alrededor (3x3)
            else if (maxDist === 2) puntos = 1; // Un poco más lejos (5x5)

            return puntos;
        }

        // --- Integración con los clics ---

        // Botón de inicio
        // Configurar jugadores al empezar
        const coloresJugadores = [
            { nombre: 'Rojo', hex: '#ef4444' },
            { nombre: 'Azul', hex: '#3b82f6' },
            { nombre: 'Verde', hex: '#22c55e' },
            { nombre: 'Amarillo', hex: '#eab308' },
            { nombre: 'Rosa', hex: '#ec4899' },
            { nombre: 'Naranja', hex: '#f97316' },
            { nombre: 'Cian', hex: '#06b6d4' },
            { nombre: 'Morado', hex: '#a855f7' },
            { nombre: 'Lima', hex: '#84cc16' },
            { nombre: 'Blanco', hex: '#f8fafc' }
        ];

        document.getElementById('start-btn').addEventListener('click', () => {
            const numPlayers = parseInt(document.getElementById('players-select').value);
            listaJugadores = Array.from({ length: numPlayers }, (_, i) => ({
                id: i,
                nombre: coloresJugadores[i].nombre,
                color: coloresJugadores[i].hex,
                puntos: 0
            }));

            document.getElementById('start-buttons').classList.add('hidden');
            document.getElementById('game-stats').classList.remove('hidden');

            generateBoard();
            iniciarRonda();
        });


        const guideModal = document.getElementById('guide-modal');
        const targetPreview = document.getElementById('target-preview');
        const closeModalBtn = document.getElementById('close-modal-btn');

        // Función mejorada para seleccionar el color
        function seleccionarColorSecreto() {
            const opciones = [];
            const contenedorOpciones = document.createElement('div');
            contenedorOpciones.className = 'grid grid-cols-2 gap-4 mb-6';

            for (let i = 0; i < 4; i++) {
                const r = Math.floor(Math.random() * rows);
                const c = Math.floor(Math.random() * columns);

                // REPLICAR LÓGICA RADIAL (HSL)
                const centerX = 14.5;
                const centerY = 7.5;
                const dx = c - centerX;
                const dy = r - centerY;
                let h = (Math.atan2(dy, dx) * (180 / Math.PI)) + 90;
                if (h < 0) h += 360;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = Math.sqrt(centerX * centerX + centerY * centerY);
                const pctDist = dist / maxDist;
                const l = 85 - (pctDist * 70);
                const s = 90 - (pctDist * 30);
                const colorHsl = `hsl(${h}, ${s}%, ${l}%)`;
                const coordenada = `${letras[r]}${c + 1}`;

                opciones.push({ fila: r, columna: c, coordenada, hsl: colorHsl });

                // Crear botón de opción visual
                const btnOpción = document.createElement('button');
                btnOpción.className = 'group flex flex-col items-center p-2 rounded-xl border-2 border-transparent hover:border-acento transition-all bg-gray-700/50';
                btnOpción.innerHTML = `
            <div class="w-16 h-16 rounded-lg mb-2 shadow-md" style="background-color: ${colorHsl}"></div>
            <span class="text-xs font-bold text-white">${coordenada}</span>
        `;

                btnOpción.onclick = () => confirmarSeleccionColor(opciones[i]);
                contenedorOpciones.appendChild(btnOpción);
            }

            // Actualizar el Modal
            const modalContent = document.querySelector('#guide-modal div');
            modalContent.innerHTML = `
        <h2 class="text-2xl font-prisma text-acento mb-2">Elige tu Color</h2>
        <p class="text-xs text-tarjeta mb-4">Selecciona uno de estos 4 tonos para esta ronda:</p>
        <div id="opciones-container"></div>
    `;
            document.getElementById('opciones-container').appendChild(contenedorOpciones);

            guideModal.classList.remove('hidden');
        }

        function confirmarSeleccionColor(colorElegido) {
            colorObjetivo = colorElegido;

            const modalContent = document.querySelector('#guide-modal div');
            modalContent.innerHTML = `
        <h2 class="text-2xl font-prisma text-acento mb-4">¡Color Registrado!</h2>
        <div class="flex flex-col items-center py-4">
            <div class="w-24 h-24 rounded-full border-4 border-white mb-4" style="background-color: ${colorElegido.hsl}"></div>
            <p class="text-white mb-6">Has elegido <b>${colorElegido.coordenada}</b>.<br>Memorízalo bien.</p>
            <button id="close-privacy-btn" class="w-full py-3 bg-acento text-gray-900 font-bold rounded-xl hover:bg-white transition">
                OCULTAR Y EMPEZAR
            </button>
        </div>
    `;

            document.getElementById('close-privacy-btn').onclick = () => {
                guideModal.classList.add('hidden');
            };
        }

        function revelarObjetivo() {
            const todasLasCeldas = document.querySelectorAll('#game-board > div');

            const getCeldaReal = (f, c) => {
                if (f < 0 || f >= rows || c < 0 || c >= columns) return null;
                const indiceDOM = ((f + 1) * 31) + (c + 1);
                return todasLasCeldas[indiceDOM];
            };

            // 1. Marcar el Centro (Estrella y brillo blanco)
            const centro = getCeldaReal(colorObjetivo.fila, colorObjetivo.columna);
            if (centro) {
                centro.classList.add('score-3');
                centro.innerHTML = '<div class="w-full h-full flex items-center justify-center text-white font-bold drop-shadow-md">⭐</div>';
                centro.style.zIndex = "30";
            }

            // 2. Dibujar zonas de puntuación (Bordes sutiles)
            for (let fOffset = -2; fOffset <= 2; fOffset++) {
                for (let cOffset = -2; cOffset <= 2; cOffset++) {
                    const f = colorObjetivo.fila + fOffset;
                    const c = colorObjetivo.columna + cOffset;
                    const cell = getCeldaReal(f, c);
                    if (cell && cell !== centro) {
                        const dist = Math.max(Math.abs(fOffset), Math.abs(cOffset));
                        if (dist === 1) cell.classList.add('score-zone-2');
                        else if (dist === 2) cell.classList.add('score-zone-1');
                    }
                }
            }

            // 3. NUEVO: RESALTAR VOTOS DE LOS JUGADORES
            // Buscamos todas las celdas donde alguien votó
            document.querySelectorAll('#game-board div[data-votos]').forEach(el => {
                const votos = JSON.parse(el.dataset.votos);

                // Aplicamos un efecto de elevación y brillo extra
                el.style.transition = "all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275)";
                el.style.transform = "scale(1.2)"; // Hacemos la casilla más grande
                el.style.zIndex = "40"; // Por encima de las líneas de puntuación

                if (votos.length === 1) {
                    const colorJugador = listaJugadores[votos[0]].color;
                    el.style.boxShadow = `0 0 20px ${colorJugador}, inset 0 0 10px white`;
                    el.style.outline = `3px solid white`;
                    el.style.outlineOffset = "1px";
                } else {
                    // Si hay varios, intensificamos el anillo multicolor que ya tenía
                    el.style.boxShadow = `0 0 25px rgba(255, 255, 255, 0.8)`;
                    el.style.outline = `2px solid white`;
                }
            });
        }

        function iniciarRonda() {
            votosRealizados = 0;
            jugadorActualVotando = (indiceGuiaActual + 1) % listaJugadores.length;

            const guia = listaJugadores[indiceGuiaActual];
            actualizarMarcador();

            // ALERT DE PRIVACIDAD
            // Usamos setTimeout para asegurar que el marcador se actualice antes del alert
            setTimeout(() => {
                alert(`¡ATENCIÓN!\n\nEs el turno de ${guia.nombre} como Guía.\n\nAsegúrate de que nadie más esté mirando la pantalla antes de pulsar Aceptar.`);
                seleccionarColorSecreto();
            }, 100);
        }

        function procesarVoto(fila, columna) {
            // Si el guía intenta votar, lo ignoramos (opcional)
            // if (votoDeGuia) return;

            const puntos = calcularPuntuacion(fila, columna);
            votosRealizados++;

            // Aquí podrías guardar los puntos del jugador actual
            // listaJugadores[jugadorQueVoto].puntos += puntos;

            if (votosRealizados === listaJugadores.length - 1) {
                finalizarTurno();
            }
        }

        function finalizarTurno() {
            let puntosParaElGuia = 0;
            listaJugadores.forEach((jugador, idx) => {
                if (idx === indiceGuiaActual || !jugador.votoActual) return;
                const pts = calcularPuntuacion(jugador.votoActual.fila, jugador.votoActual.columna);
                jugador.puntos += pts;
                if (pts >= 2) puntosParaElGuia++;
            });

            listaJugadores[indiceGuiaActual].puntos += puntosParaElGuia;
            revelarObjetivo();
            actualizarMarcador();

            // Mover botón de Siguiente Ronda al Nav-bar
            const navActions = document.getElementById('nav-actions');
            navActions.innerHTML = `
        <button id="next-turn-btn" class="px-6 py-2 bg-white text-gray-900 rounded-full font-bold hover:bg-acento transition-all shadow-lg">
            Siguiente Ronda →
        </button>
    `;

            document.getElementById('next-turn-btn').onclick = () => {
                navActions.innerHTML = '';
                listaJugadores.forEach(j => delete j.votoActual);
                prepararSiguienteTurno();
            };
        }

        function prepararSiguienteTurno() {
            // Limpieza visual profunda
            document.querySelectorAll('#game-board div').forEach(el => {
                el.style.transform = "none";
                el.style.boxShadow = "none";
                el.style.outline = "none";
                el.style.zIndex = "1";
                el.innerHTML = "";
            });

            listaJugadores.forEach(j => delete j.votoActual);
            votosRealizados = 0;

            // Cambiar el guía para la siguiente ronda (opcional)
            indiceGuiaActual = (indiceGuiaActual + 1) % listaJugadores.length;

            generateBoard();
            iniciarRonda();
        }

        /**
        * Modifica tu función de clic en la celda para incluir esto:
        */
        function manejarClicCelda(fila, columna, elemento) {
            if (jugadorActualVotando === -1 || jugadorActualVotando === indiceGuiaActual) return;

            const jugadorActivo = listaJugadores[jugadorActualVotando];

            // 1. Limpieza del voto anterior de este jugador específico
            document.querySelectorAll('#game-board div[data-votos]').forEach(el => {
                let votos = JSON.parse(el.dataset.votos);
                if (votos.includes(jugadorActualVotando)) {
                    votos = votos.filter(id => id !== jugadorActualVotando);
                    if (votos.length === 0) {
                        delete el.dataset.votos;
                    } else {
                        el.dataset.votos = JSON.stringify(votos);
                    }
                    actualizarAparienciaCelda(el);
                }
            });

            // 2. Registrar nuevo voto
            jugadorActivo.votoActual = { fila, columna };
            let votosNuevos = elemento.dataset.votos ? JSON.parse(elemento.dataset.votos) : [];
            if (!votosNuevos.includes(jugadorActualVotando)) {
                votosNuevos.push(jugadorActualVotando);
            }
            elemento.dataset.votos = JSON.stringify(votosNuevos);
            actualizarAparienciaCelda(elemento);

            // 3. Verificar si todos han votado al menos una vez
            const adivinadoresQueVotaron = listaJugadores.filter(j => j.votoActual && j.id !== indiceGuiaActual).length;
            const totalAdivinadores = listaJugadores.length - 1;

            if (adivinadoresQueVotaron === totalAdivinadores) {
                mostrarBotonRevelar();
            } else {
                do {
                    jugadorActualVotando = (jugadorActualVotando + 1) % listaJugadores.length;
                } while (jugadorActualVotando === indiceGuiaActual);
            }

            actualizarMarcador();
        }

        function mostrarBotonRevelar() {
            const navActions = document.getElementById('nav-actions');
            navActions.innerHTML = `
        <button id="reveal-btn" class="px-6 py-2 bg-acento text-gray-900 rounded-full font-black hover:bg-white hover:scale-105 transition-all shadow-[0_0_15px_rgba(30,200,197,0.5)] animate-bounce">
            REVELAR COLOR
        </button>
    `;

            document.getElementById('reveal-btn').onclick = () => {
                navActions.innerHTML = ''; // Limpiar tras pulsar
                finalizarTurno();
            };
        }

        function actualizarAparienciaCelda(elemento) {
            if (!elemento.dataset.votos) {
                elemento.style.outline = 'none';
                elemento.style.boxShadow = 'none';
                elemento.style.backgroundImage = 'none';
                elemento.style.border = 'none'; // Limpiamos bordes previos
                return;
            }

            const votos = JSON.parse(elemento.dataset.votos);
            const colorCelda = elemento.style.backgroundColor; // Obtenemos el color original de la celda

            // Reset general de estilos para evitar solapamientos
            elemento.style.outline = 'none';
            elemento.style.boxShadow = 'none';
            elemento.style.backgroundImage = 'none';
            elemento.style.border = '4px solid transparent'; // Creamos el espacio para el anillo

            if (votos.length === 1) {
                // UN SOLO JUGADOR: Borde sólido simple
                const colorJugador = listaJugadores[votos[0]].color;
                elemento.style.border = `4px solid ${colorJugador}`;
                elemento.style.boxShadow = `0 0 10px ${colorJugador}`;
            } else if (votos.length > 1) {
                // VARIOS JUGADORES: El truco del anillo segmentado
                const listaColores = votos.map(id => listaJugadores[id].color);
                const total = listaColores.length;
                const anguloPorJugador = 360 / total;

                let gradientStr = "";
                listaColores.forEach((col, i) => {
                    gradientStr += `${col} ${i * anguloPorJugador}deg ${(i + 1) * anguloPorJugador}deg${i === total - 1 ? "" : ", "}`;
                });

                // 1. Usamos el color de la celda como "capa superior" para que el centro no cambie
                // 2. Usamos el conic-gradient como "capa inferior" que solo se verá en el borde
                elemento.style.backgroundImage = `linear-gradient(${colorCelda}, ${colorCelda}), conic-gradient(${gradientStr})`;
                elemento.style.backgroundOrigin = "border-box";
                elemento.style.backgroundClip = "padding-box, border-box";
                elemento.style.boxShadow = `0 0 15px rgba(255, 255, 255, 0.4)`;
            }
        }

        /**
        * Crea las tarjetas de los jugadores en el lateral
        */
        function actualizarMarcador() {
            const statsContainer = document.getElementById('game-stats');
            statsContainer.innerHTML = '';

            // Forzamos diseño compacto para aprovechar el contenedor estrecho
            const esCompacto = true;

            listaJugadores.forEach((jugador, index) => {
                const esGuia = index === indiceGuiaActual;
                const esSuTurno = index === jugadorActualVotando;

                const card = document.createElement('div');
                // Usamos p-1.5 y mb-1 para pegar más las tarjetas entre sí
                card.className = `bg-tarjeta p-1.5 rounded-lg border-2 flex justify-between items-center transition-all cursor-pointer hover:brightness-110 relative mb-1 shadow-sm`;
                card.style.borderColor = esSuTurno ? jugador.color : (esGuia ? 'var(--color-acento)' : '#374151');

                card.onclick = (e) => {
                    if (e.target.closest('.view-color-btn')) return;
                    if (!esGuia) {
                        jugadorActualVotando = index;
                        actualizarMarcador();
                    }
                };

                const botonConsultar = esGuia ? `
            <button class="view-color-btn p-1 ml-1 bg-gray-700 hover:bg-gray-600 rounded text-[10px] border border-acento/30">
                👁️
            </button>
        ` : '';

                // Diseño en una sola línea con texto muy ajustado
                card.innerHTML = `
            <div class="flex items-center space-x-1 overflow-hidden min-w-0 flex-1">
                <span class="text-xs" title="${esGuia ? 'Guía' : 'Jugador'}">
                    ${esGuia ? '🎨' : '👤'}
                </span>
                <div class="flex items-center min-w-0">
                    <span class="font-prisma text-xs text-white truncate">
                        ${jugador.nombre} ${esSuTurno ? '⚡' : ''}
                    </span>
                    ${botonConsultar}
                </div>
            </div>
            <div class="px-1.5 py-0.5 text-sm rounded-md font-bold text-gray-900 ml-1 min-w-[24px] text-center" style="background-color: ${jugador.color}">
                ${jugador.puntos}
            </div>
        `;

                statsContainer.appendChild(card);

                if (esGuia) {
                    card.querySelector('.view-color-btn').onclick = (e) => {
                        e.stopPropagation();
                        mostrarRecordatorioColor();
                    };
                }
            });
        }

        function mostrarRecordatorioColor() {
            if (!colorObjetivo) return;

            // 1. Alert de seguridad
            alert("RECORDATORIO PRIVADO\n\nAsegúrate de que nadie esté mirando antes de ver tu color.");

            // 2. Reutilizamos el modal para mostrar el color actual
            const modalContent = document.querySelector('#guide-modal div');
            modalContent.innerHTML = `
        <h2 class="text-2xl font-prisma text-acento mb-4">Recordatorio</h2>
        <div class="flex flex-col items-center py-4">
            <div class="w-24 h-24 rounded-full border-4 border-white mb-4 shadow-lg" style="background-color: ${colorObjetivo.hsl}"></div>
            <p class="text-white text-lg mb-2">Tu color es <b>${colorObjetivo.coordenada}</b></p>
            <p class="text-xs text-tarjeta mb-6">Memorízalo de nuevo y cierra esta ventana.</p>
            <button id="close-reminder-btn" class="w-full py-3 bg-acento text-gray-900 font-bold rounded-xl hover:bg-white transition">
                CONTINUAR PARTIDA
            </button>
        </div>
    `;

            guideModal.classList.remove('hidden');

            document.getElementById('close-reminder-btn').onclick = () => {
                guideModal.classList.add('hidden');
            };
        }


    </script>

</body>
